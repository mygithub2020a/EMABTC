name: Package Singular dynamic modules

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/package-singular-modules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install Singular and locate runtime modules
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y singular
          Singular --version | tee singular-version.txt
          dpkg -L singular | sort > singular-package-files.txt
          find /usr/lib /usr/share/singular -type f \( -name '*.so' -o -name '*.so.*' \) 2>/dev/null | sort > singular-module-files.txt
          cat singular-module-files.txt
      - name: Package modules preserving paths
        shell: bash
        run: |
          set -euxo pipefail
          mkdir module-bundle
          while read -r f; do cp -L --parents "$f" module-bundle/; done < singular-module-files.txt
          tar -czf singular-modules-ubuntu24-amd64.tar.gz -C module-bundle .
          sha256sum singular-modules-ubuntu24-amd64.tar.gz > singular-modules.sha256
      - name: Upload module bundle
        uses: actions/upload-artifact@v4
        with:
          name: singular-modules-ubuntu24-amd64
          path: |
            singular-modules-ubuntu24-amd64.tar.gz
            singular-modules.sha256
            singular-version.txt
            singular-package-files.txt
            singular-module-files.txt
          retention-days: 7
