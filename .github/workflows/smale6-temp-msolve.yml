name: Temporary Smale6 reduced verticality gate

on:
  pull_request:
    branches: [master]
    paths:
      - 'smale6_temp/**'
      - '.github/workflows/smale6-temp-msolve.yml'

permissions:
  contents: read

concurrency:
  group: smale6-verticality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  modular-verticality:
    name: reduced verticality p=${{ matrix.prime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        prime: [101, 32003]
    steps:
      - uses: actions/checkout@v4
      - name: Install Singular and materialize exact input
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y singular
          Singular --version | tee singular-version.txt
          sed 's/__CHAR__/${{ matrix.prime }}/g' smale6_temp/fivebody_reduced_verticality.sing > verticality_${{ matrix.prime }}.sing
          sha256sum verticality_${{ matrix.prime }}.sing > input.sha256
      - name: Compute exact saturated verticality ideal
        shell: bash
        run: |
          set +e
          /usr/bin/time -v timeout 100m Singular -q verticality_${{ matrix.prime }}.sing > solver.stdout 2> solver.stderr
          status=$?
          echo "$status" > solver.status
          echo "status=$status"
          tail -n 500 solver.stdout || true
          tail -n 500 solver.stderr || true
          exit 0
      - name: Upload exact computation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verticality-singular-${{ matrix.prime }}
          path: |
            singular-version.txt
            verticality_${{ matrix.prime }}.sing
            input.sha256
            solver.stdout
            solver.stderr
            solver.status
          retention-days: 7
