name: Temporary Smale6 round7 determinant-derivative gates

on:
  pull_request:
    branches: [master]
    paths:
      - 'smale6_round7/**'
      - '.github/workflows/smale6-temp-msolve.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smale6-round7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rank-two-charts:
    name: rank2 chart=${{ matrix.chart }} p=${{ matrix.prime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        prime: [101]
        chart: ['00','01','02','10','11','12','20','21','22']
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact modular system and install msolve
        shell: bash
        run: |
          set -euxo pipefail
          ROW=${{ matrix.chart }}; ROW=${ROW:0:1}
          COL=${{ matrix.chart }}; COL=${COL:1:1}
          python smale6_round7/generate_fivebody_detderiv_sparse.py \
            --prime '${{ matrix.prime }}' --row "$ROW" --col "$COL" \
            --output system_${{ matrix.chart }}_${{ matrix.prime }}.in \
            | tee system_${{ matrix.chart }}_${{ matrix.prime }}.generator.json
          curl -fL https://msolve.proj.lip6.fr/downloads/v0.10.1/msolve-0.10.1_linux_intel_x86.zip -o msolve.zip
          unzip -q msolve.zip -d solver
          MSOLVE=$(find solver -type f -name msolve | head -1)
          chmod +x "$MSOLVE"
          echo "MSOLVE=$MSOLVE" >> "$GITHUB_ENV"
          "$MSOLVE" -V | tee msolve-version.txt
      - name: Compute determinant-derivative chart
        shell: bash
        run: |
          set +e
          ulimit -v 6800000
          /usr/bin/time -v timeout 315m "$MSOLVE" \
            -t 4 -v 2 -g 1 -l 44 -m 256 \
            -f system_${{ matrix.chart }}_${{ matrix.prime }}.in \
            -o result_${{ matrix.chart }}_${{ matrix.prime }}.out \
            > solver_${{ matrix.chart }}_${{ matrix.prime }}.stdout \
            2> solver_${{ matrix.chart }}_${{ matrix.prime }}.stderr
          status=$?
          echo "$status" > solver_${{ matrix.chart }}_${{ matrix.prime }}.status
          tail -n 300 solver_${{ matrix.chart }}_${{ matrix.prime }}.stderr || true
          sed -n '1,160p' result_${{ matrix.chart }}_${{ matrix.prime }}.out || true
          exit 0
      - name: Upload certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round7-rank2-${{ matrix.chart }}-${{ matrix.prime }}
          path: |
            msolve-version.txt
            system_${{ matrix.chart }}_${{ matrix.prime }}.in
            system_${{ matrix.chart }}_${{ matrix.prime }}.in.meta.json
            system_${{ matrix.chart }}_${{ matrix.prime }}.generator.json
            result_${{ matrix.chart }}_${{ matrix.prime }}.out
            solver_${{ matrix.chart }}_${{ matrix.prime }}.stdout
            solver_${{ matrix.chart }}_${{ matrix.prime }}.stderr
            solver_${{ matrix.chart }}_${{ matrix.prime }}.status
          retention-days: 7
