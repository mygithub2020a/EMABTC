name: Temporary Smale6 mass-map second-jet msolve

on:
  pull_request:
    branches: [master]
    paths:
      - 'smale6_temp/**'
      - '.github/workflows/smale6-temp-msolve.yml'

permissions:
  contents: read

jobs:
  massmap-second-jet:
    name: exact mass-map jet p=1000003 chart=${{ matrix.chart }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        chart: [s, t, w]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact saturated system and solver
        run: |
          set -euxo pipefail
          python -m pip install --quiet sympy
          python smale6_temp/generate_secondjet_msolve.py --prime 1000003 --chart '${{ matrix.chart }}' --output system.ms | tee generator.log
          curl -fL https://msolve.proj.lip6.fr/downloads/v0.10.1/msolve-0.10.1_linux_intel_x86.zip -o msolve.zip
          unzip -q msolve.zip -d solver
          MSOLVE=$(find solver -type f -name msolve | head -1)
          chmod +x "$MSOLVE"
          echo "MSOLVE=$MSOLVE" >> "$GITHUB_ENV"
          "$MSOLVE" -V | tee msolve-version.txt
          wc -c system.ms
      - name: Compute exact saturated leading ideal
        shell: bash
        run: |
          set +e
          /usr/bin/time -v timeout 315m "$MSOLVE" \
            -f system.ms -o result.ms -S \
            -t 4 -v 2 -g 1 -r 0 -l 44 --random-seed 1 \
            > solver.stdout 2> solver.stderr
          status=$?
          echo "$status" > solver.status
          echo "status=$status"
          tail -n 400 solver.stdout || true
          tail -n 400 solver.stderr || true
          sed -n '1,400p' result.ms || true
          exit 0
      - name: Upload exact certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: massmap-jet2-1000003-${{ matrix.chart }}
          path: |
            system.ms
            result.ms
            solver.stdout
            solver.stderr
            solver.status
            generator.log
            msolve-version.txt
          retention-days: 7
